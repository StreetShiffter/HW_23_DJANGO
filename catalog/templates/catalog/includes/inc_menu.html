<div class="d-flex">
        <!-- Боковое меню -->
        <div class="bg-dark text-white p-3" style="width: 250px; min-height: 100vh;">
            <h4 class="mb-4">Меню</h4>
            <ul class="nav flex-column">
                <li class="nav-item">
                 <!-- Добавление условия отображение динамически выделенного пункта -->
                    <a class="nav-link active text-white {% if request.resolver_match.url_name == 'home' %}bg-danger{% endif %}" href={% url 'catalog:home' %}>Главная</a>
                </li>
                 <li class="nav-item">
                    <a class="nav-link text-white {% if request.resolver_match.url_name == 'order' %}bg-danger{% endif %}" href="#">Заказы</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white {% if request.resolver_match.url_name == 'category' %}bg-danger{% endif %}" href="#">Категории</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white {% if request.resolver_match.url_name == 'contacts' %}bg-danger{% endif %}" href={% url 'catalog:contacts' %}>Контакты</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white {% if request.resolver_match.url_name == 'create' %}bg-primary{% endif %}" href={% url 'catalog:create' %}>Создать</a>
                </li>
            </ul>

            <div class="mt-auto">
                <div class="dropdown">
                    <button class="btn btn-secondary dropdown-toggle"
                            type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        Пользователь
                    </button>
                    <ul class="dropdown-menu">
                        {% if user.is_authenticated %}
                            <li><a class="dropdown-item" href="{% url 'users:profile'%}">Профиль</a></li>
                            <li><a class="dropdown-item" href="{% url 'users:logout' %}">Выход</a></li>
                        {% else %}
                            <li><a class="dropdown-item" href="{% url 'users:register'%}">Регистрация</a></li>
                            <li><a class="dropdown-item" href="{% url 'users:loging'%}">Вход</a></li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </div>
